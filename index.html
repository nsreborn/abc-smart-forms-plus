<style id="abc-modern-workspace-v1">

/* ===== 01. DESIGN TOKENS ===== */

:root {
  --mw-primary: #a82e5c;
  --mw-primary-dark: #852144;
  --mw-primary-light: #f9eaf0;
  --mw-bg: #f7f8fa;
  --mw-white: #ffffff;
  --mw-text: #242831;
  --mw-muted: #7c8491;
  --mw-border: #e9ebef;
  --mw-shadow: 0 8px 32px rgba(25, 30, 45, .045);
  --mw-radius: 18px;
  --mw-ease: cubic-bezier(.22, 1, .36, 1);
}

/* ===== 02. GLOBAL VISUAL ===== */

@media screen {

  body:not(.in-preview):not(.a4-pagination-active) {
    background:
      radial-gradient(
        ellipse 700px 360px at 95% 0%,
        rgba(168,46,92,.045),
        transparent 75%
      ),
      var(--mw-bg) !important;

    color: var(--mw-text);
    font-family: 'Prompt', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body:not(.in-preview)::before {
    height: 2px !important;
    background: linear-gradient(
      90deg,
      #a82e5c,
      #d86b96,
      #f5d0df
    ) !important;
  }

  button,
  input,
  select,
  textarea {
    font-family: 'Prompt', sans-serif;
  }

  button {
    -webkit-tap-highlight-color: transparent;
  }

  button:focus-visible,
  a:focus-visible {
    outline: 3px solid rgba(168,46,92,.28);
    outline-offset: 3px;
  }

  /* ===== 03. SIDEBAR ===== */

  .app-sidebar {
    background: rgba(255,255,255,.97) !important;
    border-right: 1px solid var(--mw-border) !important;
    box-shadow: none !important;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }

  .app-sidebar-head {
    border-bottom-color: var(--mw-border) !important;
  }

  .app-sidebar-logo {
    background: var(--mw-primary) !important;
    color: #fff !important;
    border-radius: 13px !important;
    box-shadow: none !important;
  }

  .app-sidebar-title {
    font-weight: 600 !important;
    letter-spacing: -.3px;
  }

  .app-sidebar-subtitle {
    color: var(--mw-muted) !important;
  }

  .app-sidebar-section-label {
    color: #9aa1ad !important;
    font-size: 10px !important;
    letter-spacing: .07em;
  }

  .app-sidebar-item {
    position: relative;
    transition:
      background .2s ease,
      color .2s ease,
      transform .2s var(--mw-ease) !important;
  }

  .app-sidebar-item:hover {
    background: #f7f7f9 !important;
    transform: translateX(2px);
  }

  .app-sidebar-item.active {
    background: var(--mw-primary-light) !important;
    color: var(--mw-primary-dark) !important;
    font-weight: 500 !important;
  }

  .app-sidebar-item.active::before {
    content: "";
    position: absolute;
    left: 0;
    top: 22%;
    height: 56%;
    width: 3px;
    border-radius: 0 4px 4px 0;
    background: var(--mw-primary);
  }

  /* ===== 04. TOP NAVIGATION ===== */

  #topNavbar > div {
    background: rgba(255,255,255,.85) !important;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(233,235,239,.9) !important;
    box-shadow: 0 8px 25px rgba(20,25,40,.035) !important;
    border-radius: 15px !important;
  }

  #userDisplay {
    background: var(--mw-primary-light) !important;
    color: var(--mw-primary-dark) !important;
    border: 1px solid #f1d6e0 !important;
    border-radius: 999px !important;
    font-weight: 500 !important;
  }

  /* ===== 05. LOGIN ===== */

  #loginView {
    max-width: 470px !important;
  }

  #loginView > .card,
  #registerView > .card {
    background: #fff !important;
    border: 1px solid var(--mw-border) !important;
    border-radius: 24px !important;
    box-shadow:
      0 20px 65px rgba(20,25,40,.055) !important;
  }

  #loginView > .card {
    padding: clamp(25px, 4vw, 42px) !important;
  }

  #loginView h3 {
    color: var(--mw-text) !important;
    font-size: 23px !important;
    font-weight: 600 !important;
    letter-spacing: -.4px;
  }

  #loginView h3::before {
    width: 60px !important;
    height: 60px !important;
    border-radius: 17px !important;
    background: var(--mw-primary) !important;
    box-shadow: 0 8px 20px rgba(168,46,92,.14) !important;
    font-size: 19px !important;
  }

  #loginView .form-control,
  #registerView .form-control,
  #registerView .form-select {
    background: #fafbfc !important;
    border: 1px solid #e7e9ee !important;
    border-radius: 11px !important;
    min-height: 47px;
    transition: .2s ease;
  }

  #loginView .form-control:focus,
  #registerView .form-control:focus {
    background: white !important;
    border-color: var(--mw-primary) !important;
    box-shadow: 0 0 0 4px rgba(168,46,92,.075) !important;
  }

  #loginView #loginButton {
    min-height: 47px;
    background: var(--mw-primary) !important;
    border-color: var(--mw-primary) !important;
    border-radius: 11px !important;
    font-weight: 500;
    box-shadow: none !important;
  }

  #loginView #loginButton:hover {
    background: var(--mw-primary-dark) !important;
  }

  /* ===== 06. HOME DASHBOARD ===== */

  #homeMenuView {
    max-width: 1180px !important;
  }

  #homeMenuView > .card {
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    padding: 10px 0 36px !important;
    overflow: visible !important;
    text-align: left !important;
  }

  #homeMenuView h3 {
    font-size: clamp(26px,3vw,35px) !important;
    font-weight: 600 !important;
    color: var(--mw-text) !important;
    letter-spacing: -.8px;
    margin-bottom: 7px !important;
  }

  #homeMenuView h3::after {
    background: var(--mw-primary-light) !important;
    color: var(--mw-primary-dark) !important;
    border: 1px solid #f2dce5;
    box-shadow: none !important;
    font-size: 10px !important;
  }

  #homeMenuView p {
    color: var(--mw-muted) !important;
    margin-bottom: 20px !important;
    max-width: 720px;
    line-height: 1.75;
  }

  /* Search toolbar */

  #mw-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 22px 0 13px;
    flex-wrap: wrap;
  }

  .mw-search-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    min-width: 230px;
    max-width: 460px;
    height: 47px;
    background: white;
    border: 1px solid var(--mw-border);
    border-radius: 12px;
    padding: 0 14px;
    transition: .2s ease;
  }

  .mw-search-wrap:focus-within {
    border-color: #d6a1b7;
    box-shadow: 0 0 0 4px rgba(168,46,92,.06);
  }

  .mw-search-icon {
    color: var(--mw-muted);
    display: flex;
    align-items: center;
  }

  #mw-search {
    flex: 1;
    width: 100%;
    min-width: 0;
    border: 0 !important;
    outline: 0 !important;
    background: transparent;
    color: var(--mw-text);
    font-size: 13px;
    box-shadow: none !important;
  }

  #mw-search::placeholder {
    color: #a1a7b0;
  }

  .mw-key {
    font-size: 11px;
    color: #9aa1ad;
    background: #f6f7f9;
    border: 1px solid #edf0f2;
    border-radius: 5px;
    padding: 3px 6px;
  }

  .mw-filter {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 47px;
    padding: 0 15px;
    background: white;
    border: 1px solid var(--mw-border);
    color: #606874;
    border-radius: 12px;
    font-size: 12px;
    cursor: pointer;
    transition: .2s ease;
  }

  .mw-filter:hover {
    border-color: #d6a1b7;
    color: var(--mw-primary);
  }

  .mw-filter.active {
    background: var(--mw-primary-light);
    color: var(--mw-primary-dark);
    border-color: #efd0dc;
  }

  .mw-toolbar-meta {
    margin: 0 0 18px;
    color: var(--mw-muted);
    font-size: 12px;
  }

  /* Cards grid */

  #homeMenuView .row {
    display: grid !important;
    grid-template-columns: repeat(3,minmax(0,1fr));
    gap: 15px !important;
    margin: 0 !important;
    align-items: stretch;
  }

  #homeMenuView .row > .col-md-5 {
    width: 100% !important;
    max-width: 100% !important;
    flex: initial !important;
    padding: 0 !important;
    margin: 0 !important;
    min-width: 0;
    position: relative;
    animation: mw-enter .45s var(--mw-ease) both;
  }

  #homeMenuView .row > .col-md-5.mw-hidden {
    display: none !important;
  }

  #homeMenuView .row > .col-md-5 > button {
    position: relative;
    display: flex !important;
    align-items: center;
    width: 100%;
    min-height: 126px !important;
    height: 100%;
    padding: 22px 43px 22px 20px !important;
    background: #fff !important;
    color: var(--mw-text) !important;
    border: 1px solid var(--mw-border) !important;
    border-radius: 16px !important;
    box-shadow: var(--mw-shadow) !important;
    font-size: 14px !important;
    font-weight: 500 !important;
    line-height: 1.75;
    text-align: left !important;
    white-space: normal;
    transform: none !important;
    transition:
      border-color .22s ease,
      box-shadow .22s ease,
      background .22s ease,
      transform .22s var(--mw-ease) !important;
  }

  #homeMenuView .row > .col-md-5 > button:hover {
    background: #fffafb !important;
    border-color: #e8bfd0 !important;
    box-shadow: 0 15px 36px rgba(30,25,40,.075) !important;
    transform: translateY(-3px) !important;
  }

  #homeMenuView .row > .col-md-5 > button::after {
    content: "↗";
    position: absolute;
    right: 18px;
    top: 19px;
    color: #a4a9b2;
    font-size: 18px;
    font-weight: 400;
    transition: .2s ease;
  }

  #homeMenuView .row > .col-md-5 > button:hover::after {
    color: var(--mw-primary);
    transform: translate(2px,-2px);
  }

  /* Favorites */

  .mw-favorite {
    position: absolute;
    right: 12px;
    bottom: 11px;
    z-index: 3;
    width: 29px;
    height: 29px;
    border: none;
    border-radius: 9px;
    display: grid;
    place-items: center;
    background: transparent;
    color: #b4bac3;
    font-size: 19px;
    cursor: pointer;
    transition: .18s ease;
  }

  .mw-favorite:hover {
    background: #faf0f4;
    color: var(--mw-primary);
    transform: scale(1.08);
  }

  .mw-favorite.active {
    color: var(--mw-primary);
  }

  .mw-favorite.active::first-letter {
    color: var(--mw-primary);
  }

  .mw-empty {
    grid-column: 1 / -1;
    padding: 45px 20px;
    text-align: center;
    background: white;
    border: 1px dashed #dfe3e8;
    border-radius: 16px;
    color: var(--mw-muted);
    font-size: 13px;
  }

  /* ===== 07. BUTTONS ===== */

  .btn {
    transition:
      background .2s ease,
      color .2s ease,
      border-color .2s ease,
      box-shadow .2s ease,
      transform .2s var(--mw-ease);
  }

  .btn-primary {
    --bs-btn-bg: #a82e5c;
    --bs-btn-border-color: #a82e5c;
    --bs-btn-hover-bg: #852144;
    --bs-btn-hover-border-color: #852144;
  }

  .btn:active {
    transform: scale(.985) !important;
  }

  /* ===== 08. APP CARDS ===== */

  #historyView > .card,
  #dashboardView > .card,
  #receiptFormView > .card,
  #certReceiptFormView > .card {
    border: 1px solid var(--mw-border) !important;
    border-radius: 17px !important;
    box-shadow: var(--mw-shadow) !important;
  }

  .zoom-shell {
    border-color: var(--mw-border) !important;
    box-shadow: var(--mw-shadow) !important;
  }

  .zoom-hero {
    background: linear-gradient(
      115deg,
      #842344,
      #ad3c66
    ) !important;
  }

  .zoom-booking-bar {
    background: #ad3c66 !important;
  }

  /* ===== 09. NON-BLOCKING NOTIFICATIONS ===== */

  #mw-toast-root {
    position: fixed;
    right: 22px;
    bottom: 22px;
    z-index: 16000;
    display: flex;
    flex-direction: column;
    gap: 9px;
    pointer-events: none;
  }

  .mw-toast {
    background: #242831;
    color: white;
    padding: 12px 17px;
    font-size: 12px;
    border-radius: 11px;
    box-shadow: 0 10px 28px rgba(0,0,0,.16);
    animation: mw-enter .3s ease both;
  }

  @keyframes mw-enter {
    from {
      opacity: 0;
      transform: translateY(9px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ===== 10. RESPONSIVE ===== */

  @media(max-width:1100px) {
    #homeMenuView .row {
      grid-template-columns: repeat(2,minmax(0,1fr));
    }
  }

  @media(max-width:767px) {

    #homeMenuView {
      padding-left: 16px !important;
      padding-right: 16px !important;
    }

    #homeMenuView .row {
      grid-template-columns: 1fr;
      gap: 11px !important;
    }

    #homeMenuView .row > .col-md-5 > button {
      min-height: 94px !important;
      padding: 16px 43px 16px 18px !important;
    }

    #homeMenuView h3 {
      font-size: 24px !important;
    }

    .mw-search-wrap {
      max-width: none;
      min-width: 100%;
    }

    .mw-key {
      display: none;
    }

    #mw-toolbar {
      gap: 9px;
    }

    #loginView {
      margin-top: 28px !important;
    }

    #mw-toast-root {
      left: 16px;
      right: 16px;
      bottom: 16px;
    }
  }

  @media(prefers-reduced-motion:reduce) {
    #homeMenuView .row > .col-md-5,
    .mw-toast {
      animation: none !important;
    }
    .app-sidebar-item,
    .btn {
      transition: none !important;
    }
  }
}

/* PRINT SAFETY: only hide new interface elements */

@media print {
  #mw-toolbar,
  #mw-toolbar-meta,
  #mw-toast-root,
  .mw-favorite,
  .mw-empty {
    display: none !important;
  }
}

</style>

<script id="abc-modern-workspace-script-v1">
(function () {
  "use strict";

  const PREFIX = "abc_mw_v1_";
  const FAVORITES_KEY = PREFIX + "favorites";

  let cards = [];
  let favorites = [];
  let favoritesOnly = false;
  let initialized = false;

  function getFavorites() {
    try {
      const saved = JSON.parse(
        localStorage.getItem(FAVORITES_KEY) || "[]"
      );
      return Array.isArray(saved) ? saved : [];
    } catch (e) {
      return [];
    }
  }

  function saveFavorites() {
    try {
      localStorage.setItem(
        FAVORITES_KEY,
        JSON.stringify(favorites)
      );
    } catch (e) {
      // UI preference storage is optional.
    }
  }

  function notify(message) {
    let root = document.getElementById("mw-toast-root");

    if (!root) {
      root = document.createElement("div");
      root.id = "mw-toast-root";
      root.className = "no-print";
      root.setAttribute("role", "status");
      root.setAttribute("aria-live", "polite");
      document.body.appendChild(root);
    }

    const toast = document.createElement("div");
    toast.className = "mw-toast";
    toast.textContent = message;
    root.appendChild(toast);

    setTimeout(function () {
      toast.remove();
    }, 2300);
  }

  function normalize(text) {
    return String(text || "")
      .toLocaleLowerCase()
      .replace(/\s+/g, " ")
      .trim();
  }

  function getCardKey(button, index) {
    /*
      Use the existing action as the identifier.
      This does not modify the original onclick.
    */
    const action = button.getAttribute("onclick") || "";
    return action || ("menu-" + index);
  }

  function getCardLabel(button) {
    return normalize(button.textContent);
  }

  function applyFilters() {
    const input = document.getElementById("mw-search");
    const term = normalize(input ? input.value : "");
    const grid = document.querySelector(
      "#homeMenuView > .card > .row"
    );

    if (!grid) return;

    let visible = 0;

    cards.forEach(function (card) {
      const matchesSearch = card.label.includes(term);
      const matchesFavorite =
        !favoritesOnly || favorites.includes(card.key);

      const show = matchesSearch && matchesFavorite;

      card.element.classList.toggle("mw-hidden", !show);

      if (show) visible++;
    });

    const counter = document.getElementById("mw-count");
    if (counter) {
      counter.textContent =
        "แสดง " + visible + " จาก " +
        cards.length + " เครื่องมือ";
    }

    let empty = document.getElementById("mw-empty");

    if (!visible) {
      if (!empty) {
        empty = document.createElement("div");
        empty.id = "mw-empty";
        empty.className = "mw-empty";
        empty.textContent =
          "ไม่พบเครื่องมือที่ค้นหา ลองใช้คำค้นอื่น";
        grid.appendChild(empty);
      }
      empty.textContent = favoritesOnly && !term
        ? "ยังไม่มีเมนูโปรด กดดาวที่เครื่องมือเพื่อบันทึก"
        : "ไม่พบเครื่องมือที่ค้นหา ลองใช้คำค้นอื่น";
    } else if (empty) {
      empty.remove();
    }
  }

  function updateFavoriteButton(button, key) {
    const active = favorites.includes(key);

    button.classList.toggle("active", active);
    button.textContent = active ? "★" : "☆";
    button.setAttribute(
      "aria-label",
      active ? "นำออกจากเมนูโปรด" : "เพิ่มเป็นเมนูโปรด"
    );
    button.setAttribute("aria-pressed", String(active));
    button.title = active
      ? "นำออกจากรายการโปรด"
      : "เพิ่มในรายการโปรด";
  }

  function createFavorites() {
    cards.forEach(function (card) {
      const star = document.createElement("button");

      star.type = "button";
      star.className = "mw-favorite no-print";

      updateFavoriteButton(star, card.key);

      star.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();

        const index = favorites.indexOf(card.key);

        if (index >= 0) {
          favorites.splice(index, 1);
          notify("นำออกจากเมนูโปรดแล้ว");
        } else {
          favorites.push(card.key);
          notify("เพิ่มในเมนูโปรดแล้ว");
        }

        saveFavorites();
        updateFavoriteButton(star, card.key);
        applyFilters();
      });

      card.element.appendChild(star);
    });
  }

  function buildToolbar(home) {
    const toolbar = document.createElement("div");
    toolbar.id = "mw-toolbar";
    toolbar.className = "no-print";

    const searchWrap = document.createElement("div");
    searchWrap.className = "mw-search-wrap";

    const icon = document.createElement("span");
    icon.className = "mw-search-icon";
    icon.setAttribute("aria-hidden", "true");
    icon.textContent = "⌕";
    icon.style.fontSize = "23px";

    const input = document.createElement("input");
    input.type = "search";
    input.id = "mw-search";
    input.placeholder = "ค้นหาแบบฟอร์มหรือเครื่องมือ...";
    input.setAttribute("aria-label", "ค้นหาเครื่องมือ");

    const shortcut = document.createElement("span");
    shortcut.className = "mw-key";
    shortcut.textContent = "⌘ K";

    searchWrap.append(icon, input, shortcut);

    const favoritesButton = document.createElement("button");
    favoritesButton.type = "button";
    favoritesButton.className = "mw-filter";
    favoritesButton.id = "mw-favorites-toggle";
    favoritesButton.textContent = "☆ รายการโปรด";
    favoritesButton.setAttribute("aria-pressed", "false");

    toolbar.append(searchWrap, favoritesButton);

    const meta = document.createElement("div");
    meta.id = "mw-toolbar-meta";
    meta.className = "mw-toolbar-meta no-print";

    const counter = document.createElement("span");
    counter.id = "mw-count";
    meta.appendChild(counter);

    const grid = home.querySelector(".card > .row");

    if (!grid) return;

    grid.parentNode.insertBefore(toolbar, grid);
    grid.parentNode.insertBefore(meta, grid);

    input.addEventListener("input", applyFilters);

    favoritesButton.addEventListener("click", function () {
      favoritesOnly = !favoritesOnly;
      favoritesButton.classList.toggle(
        "active",
        favoritesOnly
      );
      favoritesButton.setAttribute(
        "aria-pressed",
        String(favoritesOnly)
      );
      favoritesButton.textContent = favoritesOnly
        ? "★ รายการโปรด"
        : "☆ รายการโปรด";

      applyFilters();
    });
  }

  function setupKeyboard() {
    document.addEventListener("keydown", function (event) {
      /*
        Cmd+K / Ctrl+K focuses the menu search.
        Escape clears the search when it has focus.
      */
      const isSearchShortcut =
        (event.metaKey || event.ctrlKey) &&
        event.key.toLowerCase() === "k";

      if (isSearchShortcut) {
        const home = document.getElementById("homeMenuView");
        const input = document.getElementById("mw-search");

        if (!home || !input) return;

        if (home.classList.contains("hidden")) return;

        event.preventDefault();
        input.focus();
        input.select();
      }

      if (event.key === "Escape") {
        const input = document.getElementById("mw-search");

        if (input && document.activeElement === input) {
          input.value = "";
          applyFilters();
          input.blur();
        }
      }
    });
  }

  function setupGreeting(home) {
    /*
      Keep the existing heading and product name.
      Add only a subtle live date above the toolbar.
    */
    const paragraph = home.querySelector(".card > p");
    if (!paragraph) return;

    if (document.getElementById("mw-greeting")) return;

    const now = new Date();
    const hour = now.getHours();

    let greeting = "สวัสดีครับ";

    if (hour < 12) {
      greeting = "สวัสดีตอนเช้า";
    } else if (hour < 17) {
      greeting = "สวัสดีตอนบ่าย";
    } else {
      greeting = "สวัสดีตอนเย็น";
    }

    const date = now.toLocaleDateString("th-TH", {
      day: "numeric",
      month: "long",
      year: "numeric"
    });

    const greetingElement = document.createElement("div");
    greetingElement.id = "mw-greeting";
    greetingElement.className = "no-print";

    Object.assign(greetingElement.style, {
      color: "#8b6475",
      fontSize: "12px",
      marginBottom: "8px",
      letterSpacing: ".1px"
    });

    greetingElement.textContent =
      greeting + " · " + date;

    paragraph.insertAdjacentElement(
      "afterend",
      greetingElement
    );
  }

  function initializeModernWorkspace() {
    if (initialized) return;

    const home = document.getElementById("homeMenuView");
    if (!home) return;

    const grid = home.querySelector(".card > .row");
    if (!grid) return;

    const elements = Array.from(
      grid.querySelectorAll(":scope > .col-md-5")
    );

    cards = elements.map(function (element, index) {
      const button = element.querySelector("button");

      if (!button) return null;

      return {
        element: element,
        button: button,
        label: getCardLabel(button),
        key: getCardKey(button, index)
      };
    }).filter(Boolean);

    if (!cards.length) return;

    favorites = getFavorites();

    setupGreeting(home);
    buildToolbar(home);
    createFavorites();
    setupKeyboard();
    applyFilters();

    initialized = true;
  }

  if (document.readyState === "loading") {
    document.addEventListener(
      "DOMContentLoaded",
      initializeModernWorkspace
    );
  } else {
    initializeModernWorkspace();
  }

})();
</script>
